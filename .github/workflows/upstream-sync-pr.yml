name: Upstream Sync PR

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to mirror and merge
        required: false
        default: main
      target_branch:
        description: Fork branch that receives the sync PR
        required: false
        default: my
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' && secrets.UPSTREAM_SYNC_TOKEN || github.token }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'my' }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' && secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream "${{ inputs.upstream_branch || 'main' }}"

      - name: Mirror upstream branch into fork main
        run: |
          git push origin "refs/remotes/upstream/${{ inputs.upstream_branch || 'main' }}:refs/heads/main" --force

      - name: Explain missing sync token
        if: failure()
        run: |
          echo "Mirroring upstream into fork main can fail with the default GITHUB_TOKEN when upstream changes include workflow files."
          echo "Add repository secret UPSTREAM_SYNC_TOKEN with a PAT that has repo + workflow access, then rerun this workflow."
          exit 1

      - name: Check whether target already contains upstream
        id: contains
        run: |
          TARGET="${{ inputs.target_branch || 'my' }}"
          UPSTREAM_REF="upstream/${{ inputs.upstream_branch || 'main' }}"
          if git merge-base --is-ancestor "$UPSTREAM_REF" "origin/$TARGET"; then
            echo "needs_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch and merge upstream
        if: steps.contains.outputs.needs_pr == 'true'
        id: branch
        run: |
          TARGET="${{ inputs.target_branch || 'my' }}"
          SYNC_BRANCH="sync/upstream-${{ inputs.upstream_branch || 'main' }}-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$SYNC_BRANCH" "origin/$TARGET"
          git merge --no-ff --no-edit "upstream/${{ inputs.upstream_branch || 'main' }}"
          git push origin "$SYNC_BRANCH"
          echo "name=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open sync PR
        if: steps.contains.outputs.needs_pr == 'true'
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
        run: |
          TARGET="${{ inputs.target_branch || 'my' }}"
          UPSTREAM_BRANCH="${{ inputs.upstream_branch || 'main' }}"
          SYNC_BRANCH="${{ steps.branch.outputs.name }}"
          EXISTING_PR_COUNT="$(gh pr list --base "$TARGET" --head "$SYNC_BRANCH" --json number --jq 'length')"
          if [ "$EXISTING_PR_COUNT" -eq 0 ]; then
            gh pr create \
              --base "$TARGET" \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream/$UPSTREAM_BRANCH into $TARGET" \
              --body "Automated upstream sync.\n\nThis PR was generated by \`Upstream Sync PR\` after mirroring \`upstream/$UPSTREAM_BRANCH\` into the fork's \`main\` branch and merging those changes into a disposable sync branch."
          fi

      - name: No-op summary
        if: steps.contains.outputs.needs_pr != 'true'
        run: |
          echo "Target branch already contains upstream/${{ inputs.upstream_branch || 'main' }}. No sync PR created."
