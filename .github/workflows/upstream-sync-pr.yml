name: Upstream Sync PR

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to mirror
        required: false
        default: main
      target_branch:
        description: Fork branch that receives the sync PR
        required: false
        default: my
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      UPSTREAM: ${{ inputs.upstream_branch || 'main' }}
      TARGET: ${{ inputs.target_branch || 'my' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream "${{ env.UPSTREAM }}"

      - name: Create sync branch from upstream
        id: make_branch
        run: |
          SYNC_BRANCH="sync/upstream-${{ env.UPSTREAM }}-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$SYNC_BRANCH" "upstream/${{ env.UPSTREAM }}"

          # If no PAT is provided, avoid including upstream workflow changes by
          # restoring .github/workflows from the current origin/main before pushing.
          if [ -z "${{ secrets.UPSTREAM_SYNC_TOKEN }}" ]; then
            git fetch origin main || true
            git checkout origin/main -- .github/workflows || true
            if ! git diff --quiet -- .github/workflows; then
              git add .github/workflows
              git commit -m "Restore local workflow files (exclude upstream workflow changes)" || true
            fi
          fi

          git push origin "$SYNC_BRANCH"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create PR from sync branch into target
        if: steps.make_branch.outputs.sync_branch != ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          SYNC_BRANCH="${{ steps.make_branch.outputs.sync_branch }}"
          EXISTING_PR_COUNT=$(gh pr list --base "${{ env.TARGET }}" --head "$SYNC_BRANCH" --json number --jq 'length')
          if [ "$EXISTING_PR_COUNT" -eq 0 ]; then
            gh pr create \
              --base "${{ env.TARGET }}" \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream/${{ env.UPSTREAM }} into ${{ env.TARGET }}" \
              --body "Automated upstream sync: this PR contains upstream/${{ env.UPSTREAM }} changes (workflows excluded when PAT not provided) to be merged into ${{ env.TARGET }}."
          else
            echo "PR from $SYNC_BRANCH -> ${{ env.TARGET }} already exists."
          fi

      - name: No-op summary
        if: steps.make_branch.outputs.sync_branch == ''
        run: |
          echo "No sync branch created."
