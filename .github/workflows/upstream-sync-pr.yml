name: Upstream Sync PR

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to mirror
        required: false
        default: main
      target_branch:
        description: Fork branch that receives the sync PR
        required: false
        default: my
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
      TARGET_BRANCH: ${{ inputs.target_branch || 'my' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ env.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Check whether sync PR is needed
        id: diff
        run: |
          if git diff --quiet "origin/$TARGET_BRANCH...upstream/$UPSTREAM_BRANCH"; then
            echo "needs_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch from upstream
        if: steps.diff.outputs.needs_pr == 'true'
        id: branch
        run: |
          SYNC_BRANCH="sync/upstream-$UPSTREAM_BRANCH-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -B "$SYNC_BRANCH" "upstream/$UPSTREAM_BRANCH"
          git push origin "$SYNC_BRANCH"
          echo "name=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open sync PR
        if: steps.diff.outputs.needs_pr == 'true'
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
        run: |
          SYNC_BRANCH="${{ steps.branch.outputs.name }}"
          EXISTING_PR_COUNT="$(gh pr list --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" --json number --jq 'length')"
          if [ "$EXISTING_PR_COUNT" -eq 0 ]; then
            for attempt in 1 2 3 4 5 6; do
              if gh pr create \
                --base "$TARGET_BRANCH" \
                --head "$SYNC_BRANCH" \
                --title "Sync upstream/$UPSTREAM_BRANCH into $TARGET_BRANCH" \
                --body "Automated upstream sync.\n\nThis PR was generated by \`Upstream Sync PR\` from \`upstream/$UPSTREAM_BRANCH\` into \`$TARGET_BRANCH\`."; then
                exit 0
              fi

              if [ "$attempt" -lt 6 ]; then
                echo "PR creation not ready yet; retrying in 10 seconds..."
                sleep 10
              fi
            done

            echo "Failed to create sync PR after waiting for branch propagation."
            exit 1
          else
            echo "PR from $SYNC_BRANCH -> $TARGET_BRANCH already exists."
          fi

      - name: No-op summary
        if: steps.diff.outputs.needs_pr != 'true'
        run: |
          echo "No diff between origin/$TARGET_BRANCH and upstream/$UPSTREAM_BRANCH. No sync PR created."
