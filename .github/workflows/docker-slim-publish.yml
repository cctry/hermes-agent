name: Docker Slim — Build & Push to GHCR

# Push to ghcr.io on:
#   • every merge to main  → tag :latest + :<sha>
#   • every published GitHub release  → tag :latest + :<semver> + :<sha>
#
# Multi-platform: linux/amd64 + linux/arm64 (for Apple Silicon / Graviton hosts).
on:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: docker-slim-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

env:
  # Image name in GHCR.  Uses the repository owner so forks publish to their
  # own namespace automatically (e.g. ghcr.io/myfork/hermes-agent-slim).
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hermes-agent-slim

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # arm64 emulation via QEMU is slower than native

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. QEMU for cross-platform builds ────────────────────────────────────
      # Enables building linux/arm64 images on an amd64 runner via QEMU
      # emulation.  Required for `platforms: linux/amd64,linux/arm64`.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Buildx ────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Authenticate with GHCR ────────────────────────────────────────────
      # GITHUB_TOKEN is automatically injected by Actions; no extra secrets needed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Compute image tags ─────────────────────────────────────────────────
      # docker/metadata-action generates canonical tags from the event context:
      #   push to main   → :latest, :main, :<sha7>
      #   release v1.2.3 → :latest, :1.2.3, :1.2, :1, :<sha7>
      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # On every push to main: tag as :latest and :<short-sha>
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            # On release: tag as semver (e.g. :1.2.3, :1.2, :1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Hermes Agent (slim)
            org.opencontainers.image.description=Minimal single-container Hermes Agent image (CLI + local terminal backend)
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # ── 6. Build & push ───────────────────────────────────────────────────────
      # Builds for both amd64 and arm64 in a single manifest.
      # The GHA cache (scope=slim-publish) is shared with the PR workflow
      # (scope=slim) so layers built during PR checks are reused here.
      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=slim-publish
            type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim-publish
          provenance: true    # attach SLSA provenance attestation
          sbom: true          # attach SPDX SBOM attestation

      # ── 7. Report pushed tags ─────────────────────────────────────────────────
      - name: Report pushed image
        run: |
          echo "### 🐳 Slim image pushed to GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
